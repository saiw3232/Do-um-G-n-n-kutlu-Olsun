<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doğum Günün Kutlu Olsun | Fenerbahçe</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts (Modern bir font) -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --fb-lacivert: #002D72;
            --fb-sari: #FFED00;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #0a1128;
            background-image: radial-gradient(circle at 50% 0%, #002D72 0%, #0a1128 70%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Cam Efektli Kart (Glassmorphism) */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
            max-width: 600px;
            width: 90%;
            position: relative;
            z-index: 2;
            animation: fadeIn 1.5s ease-out;
        }

        .fb-logo {
            width: 100px;
            margin-bottom: 1.5rem;
            filter: drop-shadow(0 0 15px rgba(255, 237, 0, 0.4));
        }

        h1 {
            font-weight: 800;
            font-size: 2.5rem;
            letter-spacing: 1px;
            background: linear-gradient(to right, var(--fb-sari), #ffffff, var(--fb-sari));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .name-highlight {
            color: var(--fb-sari);
            font-weight: 600;
            font-size: 2rem;
            text-shadow: 0 0 20px rgba(255, 237, 0, 0.5);
            margin-bottom: 1.5rem;
        }

        p.lead {
            font-weight: 300;
            font-size: 1.1rem;
            color: #d1d5db;
            line-height: 1.8;
            margin-bottom: 2rem;
        }

        .btn-fb {
            background-color: var(--fb-sari);
            color: var(--fb-lacivert);
            font-weight: 800;
            font-size: 1.1rem;
            padding: 12px 35px;
            border-radius: 50px;
            border: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(255, 237, 0, 0.3);
        }

        .btn-fb:hover {
            background-color: #ffffff;
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 10px 25px rgba(255, 237, 0, 0.5);
            color: var(--fb-lacivert);
        }

        #surprise-box {
            display: none;
            margin-top: 2rem;
            padding: 1.5rem;
            background: rgba(255, 237, 0, 0.1);
            border: 1px solid var(--fb-sari);
            border-radius: 15px;
            animation: slideUp 0.5s ease-out forwards;
        }

        #surprise-box h3 {
            color: var(--fb-sari);
            font-weight: 600;
            margin-bottom: 1rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 1;
        }
        .orb-1 {
            width: 300px; height: 300px;
            background: var(--fb-sari);
            top: -100px; left: -100px;
            opacity: 0.2;
        }
        .orb-2 {
            width: 400px; height: 400px;
            background: #0047AB;
            bottom: -150px; right: -150px;
            opacity: 0.3;
        }
    </style>
</head>
<body>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="glass-card">
        <img src="https://upload.wikimedia.org/wikipedia/tr/8/86/Fenerbah%C3%A7e_SK.png" alt="Fenerbahçe" class="fb-logo">
        
        <h1>DOĞUM GÜNÜN</h1>
        <h1 style="margin-top: -10px; margin-bottom: 20px;">KUTLU OLSUN</h1>
        
        <div class="name-highlight">Sevgili Buğra</div>
        
        <p class="lead">
            Sarı-lacivert bir ömür, tıpkı bu renklerin asaleti gibi geçsin. <br>
            Yeni yaşında tüm hayallerin gerçek olsun. İyi ki doğdun, iyi ki varsın!
        </p>
        
        <button class="btn-fb" onclick="showSurprise()">Gizli Mesajı Aç</button>
        
        <div id="surprise-box">
            <h3>🎉 SÜRPRİZ! 🎉</h3>
            <p>Bu site, senin için özel olarak kodlandı kanka. Doğum günün kutlu olsun!</p>
        </div>
    </div>

    <!-- SES DOSYASI (Sadece mp3 dosyasını çağırıyoruz, kontrol JS'de) -->
    <audio id="fbMars" src="fenerbahce.mp3"></audio>

    <script>
        function showSurprise() {
            var box = document.getElementById('surprise-box');
            var btn = document.querySelector('.btn-fb');
            var audio = document.getElementById('fbMars');
            
            box.style.display = 'block';
            btn.style.display = 'none'; 
            
            // Marşı çal!
            audio.play();
        }
    </script>
</body>
</html>
